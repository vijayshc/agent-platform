[pytest]
testpaths = tests
python_files = test_*.py
# pytest-flask 1.x crashes on Flask 3 during autoload; pin it off here.
# ``phoenix`` ships a pytest11 entry point that imports phoenix at autoload and
# would create its trace database in ~/.phoenix before any conftest runs. This
# platform instruments tracing itself (src/services/otel_observability.py), so
# the plugin is blocked and the database stays in the checkout's .phoenix.
addopts = -p no:pytest_flask -p no:flask -p no:phoenix
